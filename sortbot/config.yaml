robot:
  port: /dev/tty.usbmodem5B8E1155691
  id: my_awesome_follower_arm
  calibration_dir: sortbot/calib
  urdf: SO101/so101_new_calib.urdf
leader:
  # SO101 leader arm, used to teleoperate the follower during calibration (sortbot.calibrate / HUD "Start calibration")
  port: /dev/tty.usbmodem5B790176171
  id: my_awesome_leader_arm     # motor calibration: robot.calibration_dir/<id>.json
cameras:
  # indices verified 2026-08-30 by snapshot: 0 = overhead, 1 = wrist, 2 = OBS virtual cam (ignore). Re-check with lerobot-find-cameras opencv if USB order changes.
  overhead: {index: 0, width: 640, height: 480, fps: 30}
  wrist: {index: 1, width: 640, height: 480, fps: 30}
workspace:
  # Offset from the URDF's gripper_frame_link (what FK returns) to the point BETWEEN the jaws that
  # actually grasps, in that frame's own coords. Measured from the meshes: the dummy frame sits ~7.8 mm
  # off the jaw centreline (toward the fixed jaw) and ~3.7 mm back from the fingertips. That offset
  # rotates with shoulder_pan / wrist_roll, so leaving it in makes every pick miss by up to 8 mm in a
  # pose-dependent direction AND injects an error the camera homography cannot absorb.
  # Set to [0, 0, 0] to go back to the raw URDF frame (then recalibrate).
  tool_offset_mm: [-7.8, 0.0, 3.7]
  table_z_mm: 0.0
  # GRASP DEPTH TRIM (mm, range -150..+150, live-editable from the HUD Tune tab / set_z_trim).
  # NEGATIVE lowers the plane the gripper descends to. Use it when the jaws stop short of the table
  # (the usual symptom: picks close on air just above the object); raise it if the arm presses down.
  # It shifts the commanded grasp/place z AND the safety envelope's z floor together. Beyond -40 mm it
  # still works but is warned about: check the arm clears the table before running.
  z_trim_mm: -10
  # Absolute floor for any commanded z (table-frame mm). A backstop against a typo or a runaway, NOT a
  # policy limit -- lower it if your table really does sit further below the assumed plane.
  z_floor_mm: -150.0
  gripper_clearance_mm: 15.0
  travel_z_mm: 120.0
  grasp_z_mm: 8.0
  max_step_mm: 250.0
  aabb_mm: {min: [120.0, -220.0, 0.0], max: [420.0, 220.0, 250.0]}
  home: {x: 150.0, y: 0.0, z: 180.0, roll_deg: 0.0}
aruco:
  dict: DICT_4X4_50
  tag_size_mm: 40.0
  # 400x300 mm mat; ids in order TL, TR, BR, BL (x fwd, y left)
  tags:
    0: [420.0, 200.0]
    1: [420.0, -200.0]
    2: [120.0, -200.0]
    3: [120.0, 200.0]
calibration:
  # teleop/ball mode (default for sortbot.calibrate): the follower gripper holds a coloured target, the human moves it
  # with the leader arm and captures samples; overhead px -> base-frame mm is fitted directly (no ArUco).
  # mode: ball = always use the fitted H from calib.json; aruco = tags only; auto = fitted H, tags override when all 4 seen
  mode: auto
  target: green            # green | orange | hsv:lo_h,lo_s,lo_v,hi_h,hi_s,hi_v   (or click the HUD overhead image)
  ball_radius_mm: 20.0
  min_sample_spacing_mm: 15.0
vlm:
  model: gpt-5.6-luna       # the PLANNER: sees the photos, emits one tool call per step
  # The CHAT worker ("Luna") answers the human while the planner keeps working: small + fast + vision.
  chat_model: gpt-5.4-mini
  chat_effort: low         # none | low | medium | high  (reasoning effort for chat + verify; keep it low)
  # The grasp-alignment check before every close (overhead + wrist -> aligned/dx/dy). Defaults to chat_model.
  verify_model: gpt-5.4-mini
grasp:
  # NEVER close the claw without first checking BOTH cameras that the jaws are over the object.
  verify: true              # false is possible but logs a loud warning at startup -- keep it true
  max_correction_cm: 2.0    # a single re-centring nudge is clamped to this
  max_retries: 2            # re-checks after a correction; still not aligned -> the pick is ABORTED
  min_confidence: 0.5       # a low-confidence "aligned" verdict does not count as aligned
voice:
  elevenlabs_voice_id: 21m00Tcm4TlvDq8ikWAM
  tts_model: eleven_flash_v2_5    # eleven_flash_v2_5 | eleven_turbo_v2_5 | eleven_multilingual_v2 | eleven_v3
  stt_model: scribe_v2           # scribe_v2 | scribe_v1
hud:
  port: 8765
calib_file: sortbot/calib/calib.json
